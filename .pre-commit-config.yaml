# Local guardrails. Install once with: .venv/bin/pre-commit install
# (default_install_hook_types below installs both the commit and push hooks).
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch      # refuse commits made directly on main
        args: [--branch, main]
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files  # keeps the repo small (no binaries/datasets)
        args: [--maxkb=300]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks                 # uses .gitleaks.toml (custom slk_ rule + defaults)

  - repo: local
    hooks:
      - id: protect-main-push
        name: refuse direct and force pushes to main
        entry: scripts/hooks/protect_main_push.sh
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
