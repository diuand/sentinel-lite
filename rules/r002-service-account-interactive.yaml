id: R-002
name: Interactive password login by a service account
description: >
  Service accounts authenticate with keys from automation. A password login
  means someone is using the account by hand, which is a common sign of
  credential theft.
severity: critical
risk: 30
conditions:
  - field: user.name
    in: [svc_backup, svc_deploy]
  - field: message
    contains: "Accepted password"
